    <meta property="og:title" content="Crypto Strategy Tester" />
    <meta property="og:description" content="Advanced cryptocurrency trading strategy tester and backtesting simulator supporting multiple coins, quote pairs, timeframes, and quantitative strategy metrics." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Prevent multi-wallet browser extension conflicts (e.g. MetaMask, Phantom, Coinbase Wallet "Cannot redefine property: ethereum")
      (function() {
        // Suppress and swallow browser extension errors for 'Cannot redefine property: ethereum'
        window.addEventListener('error', function (event) {
          if (event && event.message && event.message.includes('ethereum')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          if (event && event.reason && String(event.reason).includes('ethereum')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // Pre-create a configurable proxy descriptor for window.ethereum so multiple wallet extensions do not crash on defineProperty
        try {
          var currentEthereum = window.ethereum;
          var desc = Object.getOwnPropertyDescriptor(window, 'ethereum');
          if (!desc || desc.configurable) {
            Object.defineProperty(window, 'ethereum', {
              configurable: true,
              enumerable: true,
              get: function() {
                return currentEthereum;
              },
              set: function(val) {
                currentEthereum = val;
              }
            });
          }
        } catch (e) {
          // Ignore
        }
      })();
    </script>
